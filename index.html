<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO Title -->
    <title>
      MS The Royal Detailing Studio | Premium Car Detailing & PPF
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="MS The Royal Detailing Studio offers premium car detailing, PPF, ceramic coating, sun films, interior detailing, headlight restoration, colour PPF and alloy painting."
    />

    <!-- Search Engine Instructions -->
    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://mstheroyaldetailingstudio.netlify.app/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/vite.svg"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="MS The Royal Detailing Studio | Premium Car Detailing & PPF"
    />

    <meta
      property="og:description"
      content="Premium car detailing, PPF, ceramic coating, sun films, interior detailing, headlight restoration, colour PPF and alloy painting."
    />

    <meta
      property="og:url"
      content="https://mstheroyaldetailingstudio.netlify.app/"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="MS The Royal Detailing Studio | Premium Car Detailing & PPF"
    />

    <meta
      name="twitter:description"
      content="Premium car detailing, PPF, ceramic coating, sun films, interior detailing and automotive protection services."
    />

    <!-- Local Business Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "MS The Royal Detailing Studio",
        "url": "https://mstheroyaldetailingstudio.netlify.app/",
        "description": "Premium car detailing studio offering PPF, ceramic coating, sun films, interior detailing, headlight restoration, colour PPF and alloy painting.",
        "serviceType": [
          "Car Detailing",
          "Paint Protection Film",
          "Ceramic Coating",
          "Sun Films",
          "Interior Car Detailing",
          "Headlight Restoration",
          "Colour PPF",
          "Alloy Painting"
        ]
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
